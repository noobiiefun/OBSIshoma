<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>OBSIshoma Overlay</title>
<style>
:root{--accent:#d6b25e;--bg:#0c1a14;--led:#7dffb2;--ivory:#f3ecd8;--s:1}
*{box-sizing:border-box;margin:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ivory)}
#bar{position:absolute;left:50%;transform:translateX(-50%) scale(var(--s));display:flex;align-items:stretch;gap:0;
 background:var(--bg);border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 6px color-mix(in srgb,var(--bg) 70%,transparent);overflow:hidden}
#bar.bottom{bottom:28px;transform-origin:bottom center}#bar.top{top:28px;transform-origin:top center}
#bar.off{display:none}
.blk{padding:14px 26px;display:flex;flex-direction:column;justify-content:center}
.off{display:none!important}.blk:not(.off)~.blk:not(.off){border-left:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
#clock{font:700 64px/1 "Consolas","Courier New",monospace;color:var(--led);text-shadow:0 0 14px color-mix(in srgb,var(--led) 55%,transparent);letter-spacing:2px}
#clock:not(.off)+#dt{margin-top:8px}#date{font-size:17px;color:var(--ivory)}#hijri{font-size:15px;color:var(--accent)}
#nextlbl{font-size:18px;color:var(--accent)}
#cd{font:700 40px/1.1 "Consolas","Courier New",monospace;color:var(--ivory)}
#list{display:flex;padding:0}
.t{padding:14px 18px;text-align:center;min-width:96px}.t+.t{border-left:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.t b{display:block;font-size:15px;font-weight:600;color:var(--accent)}
.t span{font:700 28px/1.3 "Consolas","Courier New",monospace}
.t.next{background:var(--accent)}.t.next b,.t.next span{color:var(--bg)}
#card{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;
 min-width:560px;max-width:1000px;text-align:center;padding:34px 44px 30px;background:var(--bg);border:4px solid var(--accent);border-radius:22px;
 box-shadow:0 0 0 10px color-mix(in srgb,var(--bg) 60%,transparent),0 20px 60px #000a;transition:opacity .45s,transform .45s}
#card.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pic{max-width:420px;max-height:340px;border-radius:12px;display:none;margin:0 auto 16px}
#emoji{font-size:96px;line-height:1.1;display:none}
#title{font-size:54px;font-weight:800;color:var(--accent);line-height:1.15}
#msg{font-size:28px;margin-top:10px}
#at{font:700 34px "Consolas","Courier New",monospace;color:var(--led);margin-top:14px}
#ish{display:none;margin-top:20px;padding-top:16px;border-top:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
#ish small{display:block;font-size:22px;color:var(--accent)}#ish strong{font:700 72px/1.1 "Consolas","Courier New",monospace;color:var(--led)}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style></head><body>
<div id="bar" class="bottom">
 <div class="blk" id="b1"><div id="clock">00:00:00</div><div id="dt"><div id="date"></div><div id="hijri"></div></div></div>
 <div class="blk" id="b2"><div id="nextlbl">Menuju …</div><div id="cd">00:00:00</div></div>
 <div class="blk" id="list"></div>
</div>
<div id="card"><img id="pic" alt=""><div id="emoji"></div><div id="title"></div><div id="msg"></div><div id="at"></div>
 <div id="ish"><small>ISHOMA — kembali dalam</small><strong id="ishcd">00:00</strong></div></div>
<audio id="aud"></audio>
<script src="/vendor/adhan.umd.min.js"></script><script src="/shared.js"></script>
<script>
const $=id=>document.getElementById(id);
let cfg,dayCache={k:'',list:[]},fired=new Set(),queue=[],busy=false;
async function loadCfg(){
  cfg=await (await fetch('/api/config')).json();
  const w=cfg.widget,r=document.documentElement.style;
  r.setProperty('--accent',w.accent);r.setProperty('--bg',w.bg);r.setProperty('--s',w.scale);
  $('bar').className=w.position==='top'?'top':'bottom';
  const off=(id,v)=>$(id).classList.toggle('off',!v);
  off('clock',w.showClock);off('dt',w.showDate);off('b1',w.showClock||w.showDate);off('b2',w.showCountdown);off('list',w.showList);
  if(!(w.showClock||w.showDate||w.showCountdown||w.showList))$('bar').classList.add('off');
  dayCache.k='';
}
function today(now){const k=dayKey(cfg,now)+'|'+cfg.lat+cfg.lng+cfg.fajrAngle+cfg.ishaAngle+cfg.ihtiyath+cfg.imsakMinutes+cfg.madhab;
  if(dayCache.k!==k){dayCache={k,list:computeDay(cfg,now)};
   $('list').innerHTML=dayCache.list.filter(e=>e.key!=='imsak').map(e=>`<div class="t" data-k="${e.key}"><b>${e.label}</b><span>${fmt(e.time,cfg.tz)}</span></div>`).join('');}
  return dayCache.list;}
function tick(){
  if(!cfg)return;const now=new Date(),list=today(now),dk=dayKey(cfg,now);
  $('clock').textContent=fmt(now,cfg.tz,true);
  const d=fmtDate(now,cfg.tz);$('date').textContent=d.masehi;$('hijri').textContent=d.hijri;
  const nx=nextEvent(cfg,now);
  if(nx){$('nextlbl').textContent='Menuju '+nx.label;$('cd').textContent=countdown(nx.time-now);
   document.querySelectorAll('.t').forEach(t=>t.classList.toggle('next',t.dataset.k===nx.key));}
  for(const e of list){const id=dk+e.key,diff=now-e.time;
   if(diff>=0&&diff<5000&&!fired.has(id)){fired.add(id);if(cfg.widget.showNotif&&cfg.notif[e.key].enabled)enqueue(e.key,e.time);}}
}
function enqueue(key,time){queue.push({key,time});if(!busy)next();}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function next(){
  const j=queue.shift();if(!j){busy=false;return;}busy=true;
  const n=cfg.notif[j.key],ev=EVENTS.find(e=>e.key===j.key);
  const rep=s=>(s||'').replace(/{kota}/g,cfg.city).replace(/{waktu}/g,fmt(j.time,cfg.tz)).replace(/{nama}/g,ev.label);
  $('title').textContent=rep(n.title);$('msg').textContent=rep(n.message);$('at').textContent=fmt(j.time,cfg.tz);
  const pic=$('pic'),em=$('emoji');
  if(n.image){pic.src='/media/'+encodeURIComponent(n.image);pic.style.display='block';em.style.display='none';}
  else{pic.style.display='none';em.textContent=n.emoji||ev.emoji;em.style.display=n.emoji?'block':'none';}
  $('ish').style.display='none';
  if(n.sound){const a=$('aud');a.src='/media/'+encodeURIComponent(n.sound);a.currentTime=0;a.play().catch(()=>{});}
  $('card').classList.add('on');await sleep(Math.max(3,n.duration)*1000);
  if(+n.ishoma>0){
    $('ish').style.display='block';const end=Date.now()+n.ishoma*60000;
    while(Date.now()<end){const s=Math.ceil((end-Date.now())/1000);$('ishcd').textContent=pad(Math.floor(s/60))+':'+pad(s%60);await sleep(250);}
  }
  $('card').classList.remove('on');$('aud').pause();await sleep(600);next();
}
const es=new EventSource('/events');
es.onmessage=m=>{const d=JSON.parse(m.data);if(d.type==='config')loadCfg();
  if(d.type==='test'&&cfg)enqueue(d.key,new Date());};
loadCfg().then(()=>setInterval(tick,250));
</script></body></html>
